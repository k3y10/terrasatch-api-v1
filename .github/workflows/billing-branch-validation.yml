name: Billing branch validation

on:
  push:
    branches:
      - feat/subscription-billing

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout billing branch
        uses: actions/checkout@v4
        with:
          ref: feat/subscription-billing
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Regenerate dependency lock
        run: uv lock

      - name: Commit updated lockfile
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Lock Stripe billing dependency"
          git push origin HEAD:feat/subscription-billing

      - name: Install locked development dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest
