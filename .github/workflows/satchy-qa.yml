name: Satchy QA

on:
  workflow_dispatch:
  push:
    branches:
      - feat/satchy-agent-context-missions
      - feat/integration-scope-foundation
      - feat/satchy-runs-workspace-foundation
      - feat/typescript-sdk-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run isolated full QA
        run: bash scripts/qa-oracle.sh
