name: Billing PR validation

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/billing-branch-validation.yml"
      - ".env.example"
      - "migrations/**"
      - "src/terrasatch/api/billing.py"
      - "src/terrasatch/billing/**"
      - "src/terrasatch/config.py"
      - "src/terrasatch/edge/**"
      - "src/terrasatch/identity/**"
      - "src/terrasatch/organizations/**"
      - "src/terrasatch/portal/**"
      - "src/terrasatch/radio/**"
      - "tests/api/test_billing_contract.py"
      - "tests/unit/test_billing_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify frozen dependency lock
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --extra dev --frozen

      - name: Ruff
        run: uv run ruff check src tests

      - name: Tests
        run: uv run pytest
