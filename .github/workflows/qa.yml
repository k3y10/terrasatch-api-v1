name: QA

on:
  pull_request:
  push:
    branches:
      - agent/satchy-intelligence-0.3

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check src tests

      - name: Tests
        run: pytest --cov=terrasatch --cov-report=term-missing
