name: Billing staging browser acceptance

on:
  push:
    branches:
      - feat/subscription-billing
    paths:
      - ".github/workflows/billing-staging-browser-acceptance.yml"
      - "scripts/billing-staging-browser-acceptance.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-staging-browser-acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout billing branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run real Stripe sandbox lifecycle
        env:
          CI: "true"
        run: node scripts/billing-staging-browser-acceptance.mjs

      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: billing-staging-browser-acceptance-failure
          path: billing-staging-acceptance-failure.png
          if-no-files-found: ignore
          retention-days: 7
