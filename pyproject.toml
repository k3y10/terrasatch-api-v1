[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "terrasatch-ai-radio-core"
version = "0.1.0"
description = "TerraSatch API: authorized radio traffic to structured operational intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "TerraSatch" }]
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "itsdangerous>=2.2,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.9,<1",
    "redis>=5.0,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<26",
    "typer>=0.12,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5.0,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
terrasatch = "terrasatch.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/terrasatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
branch = true
source = ["terrasatch"]

[tool.coverage.report]
show_missing = true
fail_under = 80